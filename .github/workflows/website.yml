# Builds and deploys the landing page (packages/website) to Cloudflare Workers.
#
# - pull_request: builds and uploads a preview version; nothing goes live. The
#   preview URLs are posted as a comment on the PR (one comment, updated on
#   every push) and in the job summary: a branch URL that stays the same
#   across pushes, and the URL of this push's version.
# - push to main / schedule / manual: builds and deploys. The daily schedule
#   refreshes the build-time GitHub facts on the page (latest version).
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN   — API token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  — the Cloudflare account id
#
# The docs (/docs) are not built here: the Worker proxies them to Mintlify,
# which deploys on its own from docs/.

name: Website

on:
  pull_request:
    paths: ["packages/website/**", ".github/workflows/website.yml"]
  push:
    branches: [main]
    paths: ["packages/website/**", ".github/workflows/website.yml"]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Build
        run: npm run build -w @accountant24/website
        env:
          # Raises the GitHub API rate limit for the build-time version fetch.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the preview alias after the branch
        if: github.event_name == 'pull_request'
        id: alias
        env:
          BRANCH: ${{ github.head_ref }}
          PR: ${{ github.event.pull_request.number }}
        # Cloudflare alias rules: lowercase letters, digits and dashes, starting
        # with a letter, and alias + "-accountant24-website" within 63 chars.
        run: |
          name=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^[^a-z]+//' | cut -c1-42 | sed -E 's/-+$//')
          echo "name=${name:-pr-$PR}" >> "$GITHUB_OUTPUT"

      - name: Upload preview version
        if: github.event_name == 'pull_request'
        id: preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/website
          # The alias gives the branch one preview URL that follows every push;
          # the versioned URL is different for each push.
          command: versions upload --preview-alias ${{ steps.alias.outputs.name }}

      - name: Post the preview URLs on the PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          WRANGLER_OUTPUT: ${{ steps.preview.outputs.command-output }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        # Wrangler prints "Version Preview Alias URL: …" and "Version Preview
        # URL: …"; the URL is the last word of each line. `--edit-last` keeps a
        # single comment per PR (the workflow's own last comment) up to date.
        run: |
          branch_url=$(awk '/Version Preview Alias URL:/ { print $NF }' <<< "$WRANGLER_OUTPUT")
          push_url=$(awk '/Version Preview URL:/ { print $NF }' <<< "$WRANGLER_OUTPUT")
          body=$(printf '**Landing page preview**\n\nBranch, same URL on every push: %s\nThis push (%s): %s\n' "$branch_url" "${SHA::7}" "$push_url")
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR" --edit-last --create-if-none --body "$body"

      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/website
          command: deploy
